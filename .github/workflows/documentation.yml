name: Documentation

# Run on every change so deleted link targets are checked and required checks
# cannot stay pending because a path filter skipped the workflow.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  documentation:
    name: Repository documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Test documentation rules
        run: python tests/host/repository_docs_tests.py
      - name: Check repository documentation
        env:
          CONTINUITY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$CONTINUITY_BASE" ]; then
            python tools/check_repository_docs.py --base-ref "$CONTINUITY_BASE"
          else
            echo "No comparison base for manual dispatch; structural continuity checks only."
            python tools/check_repository_docs.py
          fi
