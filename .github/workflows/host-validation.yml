name: Host validation

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: host-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-tests:
    name: Windows host matrix
    runs-on: windows-2025
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Install UCRT64 GCC
        id: msys2
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Run complete host matrix
        shell: pwsh
        env:
          OPENTRAIL_MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: .\tools\Test-Host.ps1
