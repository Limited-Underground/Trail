name: Host validation

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: host-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    # One Test-Host.ps1 run split into parallel shards; together they run
    # exactly what -Shard All runs locally.
    name: Windows core host tests (${{ matrix.shard }})
    runs-on: windows-2025
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [Native, Python, SecurityNative, SecurityPythonA, SecurityPythonB]

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.6'

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'

      - name: Install pinned signature-vector tools
        shell: pwsh
        run: python -m pip install --disable-pip-version-check -r .\tools\requirements-signature-vector.txt

      - name: Install UCRT64 GCC
        id: msys2
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc

      # Bytes are used only if they equal the libsodium pins (dependencies.py).
      - name: Restore pinned libsodium downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/libsodium-cache
          key: libsodium-1.0.22-865ea3aba354b16be4c7051da48b63247a395f30d1e0537269b253918aa78c5f-5e3983c5496a3cffba3d013c70991b18cda6c345655fff883fb0e14dfa09e582

      - name: Verify adopted authenticated messaging composition
        if: ${{ matrix.shard == 'Native' }}
        shell: pwsh
        env:
          OPENTRAIL_MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          python -X utf8 -B .\tools\companion_packet_service_ci.py --out "$env:RUNNER_TEMP/ot0005i-host"
          if ($LASTEXITCODE -ne 0) { throw "OT-0005i host composition failed." }

      - name: Run core host matrix shard
        shell: pwsh
        env:
          OPENTRAIL_MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
          OPENTRAIL_LIBSODIUM_CACHE: ${{ runner.temp }}/libsodium-cache
          HOST_SHARD: ${{ matrix.shard }}
        run: .\tools\Test-Host.ps1 -SkipSecurityOperators -Shard $env:HOST_SHARD

  security-operators:
    name: Windows security operator (${{ matrix.operator }})
    runs-on: windows-2025
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        operator: [Sync, Receipt, Invitation, Deadline]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.6'

      - name: Install UCRT64 GCC
        id: msys2
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Run complete operator matrix
        shell: pwsh
        env:
          SECURITY_OPERATOR: ${{ matrix.operator }}
          OPENTRAIL_MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $env:Path = (Join-Path $env:OPENTRAIL_MSYS2_ROOT 'ucrt64\bin') + ';' + $env:Path
          python -X utf8 -B ".\tools\Test-Security${env:SECURITY_OPERATOR}Operator.py"
          if ($LASTEXITCODE -ne 0) { throw "Security operator matrix failed." }

  android-v1test:
    name: Android V1-Test compilation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compile V1-Test
        shell: bash
        working-directory: android
        run: |
          export JAVA_HOME="${JAVA_HOME_17_X64:?Java 17 is required}"
          export PATH="$JAVA_HOME/bin:$PATH"
          bash ./gradlew --no-daemon :app:compileV1TestKotlin

  host-tests:
    name: Windows host matrix
    if: ${{ always() }}
    needs: [core-tests, security-operators, android-v1test]
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - name: Require every host suite to pass
        shell: pwsh
        env:
          CORE_RESULT: ${{ needs.core-tests.result }}
          OPERATORS_RESULT: ${{ needs.security-operators.result }}
          ANDROID_RESULT: ${{ needs.android-v1test.result }}
        run: |
          if ($env:CORE_RESULT -ne 'success' -or $env:OPERATORS_RESULT -ne 'success' -or $env:ANDROID_RESULT -ne 'success') {
            throw "Host validation incomplete: core=$env:CORE_RESULT operators=$env:OPERATORS_RESULT android-v1test=$env:ANDROID_RESULT"
          }
