name: Bug report
description: Report reproducible behavior in Trail
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "Do not include PINs, keys, device addresses or private locations. Report security concerns through SECURITY.md."
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Explain what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Test setup
      description: App/firmware versions, phone OS and hardware model. Omit private identifiers.
    validations:
      required: true
