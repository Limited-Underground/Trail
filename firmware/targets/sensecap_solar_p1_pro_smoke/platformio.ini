[platformio]
src_dir = ../..
libdeps_dir = ../../../build/repeater-baseline/p5-sx1262-adapter-20261030/libdeps
build_dir = ../../../build/repeater-baseline/p5-target-bound-20261031/target
[env:p1pro_smoke]
platform = https://github.com/Seeed-Studio/platform-seeedboards/archive/a6fd41debbbcda13b5340fff50c9092ed3289194.zip
board = seeed-xiao-afruitnrf52-nrf52840-plus
framework = arduino
lib_deps = https://github.com/jgromes/RadioLib/archive/refs/tags/7.1.2.zip
upload_protocol = custom
upload_command = python -c "raise SystemExit('Upload prohibited for build-only smoke target')"
platform_packages =
    tool-adafruit-nrfutil@https://dl.registry.platformio.org/download/platformio/tool/tool-adafruit-nrfutil/1.503.0/tool-adafruit-nrfutil-1.503.0.tar.gz
    framework-cmsis@https://dl.registry.platformio.org/download/platformio/tool/framework-cmsis/2.50700.210515/framework-cmsis-2.50700.210515.tar.gz
    tool-scons@https://dl.registry.platformio.org/download/platformio/tool/tool-scons/4.40801.0/tool-scons-4.40801.0.tar.gz
    toolchain-gccarmnoneeabi@file://${sysenv.P1PRO_TOOLCHAIN_DIR}
build_unflags = -std=gnu++11
build_flags = -std=gnu++17
    -I../../components/delivery/include
    -I../../components/radio/include
    -Wl,-Map,../../../build/repeater-baseline/p5-target-bound-20261031/firmware.map
build_src_filter = -<*>
    +<targets/sensecap_solar_p1_pro_smoke/src/main.cpp>
    +<targets/sensecap_solar_p1_pro_smoke/src/p1pro_sx1262_radio_port.cpp>
    +<components/delivery/src/duplicate_window.cpp>
    +<components/delivery/src/duplicate_checkpoint_codec.cpp>
    +<components/delivery/src/duplicate_checkpoint_store.cpp>
    +<components/delivery/src/single_repeater_forwarder.cpp>
    +<components/delivery/src/single_repeater_replay_coordinator.cpp>
    +<components/delivery/src/repeater_lifecycle_controller.cpp>
    +<components/delivery/src/repeater_dispatch_controller.cpp>
    +<components/radio/src/lora_airtime.cpp>
